<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fd0f5">
<title>叠罗汉</title>
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --ink: #3b3148;
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#7fd0f5;
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--font);color:var(--ink);
}
body{position:fixed;inset:0;}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;}
#hud{
  z-index:2;position:absolute;left:calc(var(--sal) + 14px);top:calc(var(--sat) + 12px);
  pointer-events:none;transition:opacity .3s;opacity:0;
}
#hud.on{opacity:1;}
.pill{
  display:inline-block;background:rgba(255,255,255,.88);border:3px solid var(--ink);
  border-radius:999px;padding:4px 16px 5px;font-weight:800;line-height:1.15;
  box-shadow:0 4px 0 rgba(59,49,72,.22);
}
#hH{font-size:30px;letter-spacing:.5px;}
#hH small{font-size:15px;margin-left:3px;}
#hSub{margin-top:8px;font-size:13px;font-weight:700;padding:3px 12px 4px;border-width:2px;box-shadow:0 3px 0 rgba(59,49,72,.18);}
#mute{
  position:absolute;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 12px);
  width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);
  background:rgba(255,255,255,.88);box-shadow:0 4px 0 rgba(59,49,72,.22);
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;outline:none;z-index:6;
}
#mute:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(59,49,72,.22);}
#mute svg{width:26px;height:26px;display:block;}
#mute .off{display:none;}
#mute.muted .off{display:block;}
#mute.muted .on{display:none;}
.panel{
  position:absolute;left:0;top:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  text-align:center;opacity:0;visibility:hidden;transition:opacity .35s, visibility .35s;z-index:3;
}
.panel.on{opacity:1;visibility:visible;}
#start:not(.on){transition:none;}
#over:not(.on){transition:none;}
#start{cursor:pointer;justify-content:flex-start;}
#start .sp{flex:0 0 13%;}
h1{
  margin:0;font-size:min(22vw,17vh,108px);font-weight:900;letter-spacing:.06em;line-height:1.05;
  color:#fff;-webkit-text-stroke:0;
  text-shadow:
    -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
    0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink),
    0 9px 0 var(--ink), 0 13px 0 rgba(59,49,72,.25);
}
h1 span{display:inline-block;animation:bob 1.6s ease-in-out infinite;}
h1 span:nth-child(1){color:#ffd166;}
h1 span:nth-child(2){color:#ff8fab;animation-delay:.18s;}
h1 span:nth-child(3){color:#8ee3b4;animation-delay:.36s;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-9px) rotate(2deg);}}
#how{
  margin-top:min(5vh,30px);font-size:min(4.4vw,18px);font-weight:700;max-width:26em;line-height:1.6;
  background:rgba(255,255,255,.86);border:3px solid var(--ink);border-radius:18px;padding:9px 18px 10px;
  box-shadow:0 5px 0 rgba(59,49,72,.2);
}
#tap{
  margin-top:auto;margin-bottom:min(9vh,70px);font-size:min(5.4vw,23px);font-weight:900;color:#fff;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
#over{background:rgba(40,30,60,.28);}
#card{
  background:#fffaf0;border:4px solid var(--ink);border-radius:28px;padding:20px 26px 24px;
  width:min(86vw,350px);box-shadow:0 9px 0 rgba(59,49,72,.3);
  transform:translateY(24px) scale(.92);transition:transform .45s cubic-bezier(.2,1.5,.4,1);
}
#over.on #card{transform:none;}
#oTitle{font-size:27px;font-weight:900;}
#oNew{
  display:none;margin:8px auto 0;font-size:17px;font-weight:900;color:#fff;background:#ff6b8b;
  border:3px solid var(--ink);border-radius:999px;padding:2px 16px 3px;width:max-content;
  animation:pulse .7s ease-in-out infinite;
}
#oNew.on{display:block;}
#oH{font-size:62px;font-weight:900;line-height:1.1;margin-top:8px;color:#ff8a3d;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 5px 0 var(--ink);}
#oH small{font-size:24px;margin-left:6px;color:var(--ink);text-shadow:none;}
#oRow{display:flex;justify-content:center;gap:12px;margin-top:14px;font-size:15px;font-weight:800;}
#oRow div{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 13px 6px;flex:1;}
#oRow b{display:block;font-size:20px;}
#again{
  margin-top:18px;font-family:var(--font);font-size:23px;font-weight:900;color:var(--ink);
  background:#ffd166;border:4px solid var(--ink);border-radius:999px;padding:10px 0 12px;width:100%;
  box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:manipulation;outline:none;
}
#again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
@media (max-height:460px){
  h1{font-size:min(11vw,21vh);text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 6px 0 var(--ink);} #start .sp{flex-basis:2%;} #how{margin-top:8px;font-size:12.5px;line-height:1.45;padding:4px 14px 5px;border-width:2.5px;}
  #tap{margin-bottom:5vh;font-size:18px;}
  #card{padding:10px 22px 14px;width:min(80vw,430px);} #oTitle{font-size:20px;} #oH{font-size:40px;margin-top:2px;}
  #oRow{margin-top:8px;} #again{margin-top:10px;font-size:19px;padding:6px 0 8px;} #hH{font-size:22px;}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><span class="pill" id="hH"><span id="hHv">0.0</span><small>米</small></span></div>
  <div><span class="pill" id="hSub"><span id="hCnt">0</span> 人 · 纪录 <span id="hBest">0.0</span> 米</span></div>
</div>
<button id="mute" aria-label="声音开关" title="声音开关">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="#3b3148" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#ffd166"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#3b3148" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#d8d3df"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<div id="start" class="panel on">
  <div class="sp"></div>
  <h1><span>叠</span><span>罗</span><span>汉</span></h1>
  <div id="how">小人在天上晃来晃去<br>点击屏幕（或按空格）把他放下去<br>叠得越高越好，塔倒了就结束！</div>
  <div id="tap">点击任意位置开始</div>
</div>
<div id="over" class="panel">
  <div id="card">
    <div id="oTitle">塔倒啦！</div>
    <div id="oNew">新纪录！</div>
    <div id="oH"><span id="oHv">0.0</span><small>米</small></div>
    <div id="oRow"><div>叠了<b><span id="oCnt">0</span> 人</b></div><div>最高纪录<b><span id="oBest">0.0</span> 米</b></div></div>
    <button id="again">再来一次</button>
  </div>
</div>

window.addEventListener('orientationchange', function () { setTimeout(onResize, 60); setTimeout(onResize, 400); });
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
// ---- main loop: fixed-step simulation inside update(), rendering once per display frame ----
var lastNow = 0, perf = { phys: 0, rend: 0, physMax: 0, rendMax: 0, frames: 0 };
function frame(now) {
  window.requestAnimationFrame(frame);
  if (document.hidden) { lastNow = now; return; }
  var dt = (now - lastNow) / 1000; lastNow = now;
  if (!(dt > 0)) return;
  if (dt > 0.05) dt = 0.05;                     // long frames are clamped (no spiral of death, no jumps)
  var t0 = performance.now();
  update(dt);
  var t1 = performance.now();
  render();
  var t2 = performance.now();
  perf.frames++; perf.phys += t1 - t0; perf.rend += t2 - t1;
  if (t1 - t0 > perf.physMax) perf.physMax = t1 - t0;
  if (t2 - t1 > perf.rendMax) perf.rendMax = t2 - t1;
}
document.addEventListener('visibilitychange', function () {
  lastNow = performance.now();
  try { if (AC) { if (document.hidden) AC.suspend(); else if (userActed) AC.resume(); } } catch (e) {}
});
// ---- boot ----
try { if (!muteParam && window.localStorage.getItem(MUTE_KEY) === '1') muted = true; } catch (e) {}
applyMuteUi();
loadBest();
resize();
resetWorld('ready');
uiSync();
update(0); render();
lastNow = performance.now();
window.requestAnimationFrame(frame);
// ---- test hook ----
window.__game = {
  unitsPerMeter: UPM,
  getState: function () { return gstate; },
  start: function () { beginGame(); },
  drop: function () { return doDrop(); },
  aim: function () { return aimInfo(); },
  stats: function () { return computeStats(); },
  advance: function (seconds) {
    var rem = +seconds || 0, n = 0, st;
    while (rem > 1e-9 && n < 200000) { st = rem < 1 / 60 ? rem : 1 / 60; update(st); rem -= st; n++; }
  },
  setWind: function (v) { wind.forced = (v === null || v === undefined) ? null : clamp(+v || 0, -40, 40); }
};
window.__dlhPerf = perf;
})();
</script>
