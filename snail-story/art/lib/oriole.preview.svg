<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1640" viewBox="0 0 1800 1640">
<defs>
  <linearGradient id="oriole-pv-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B9D6E8"/>
    <stop offset="0.45" stop-color="#CFE4EF"/>
    <stop offset="1" stop-color="#EAF3F2"/>
  </linearGradient>
  <linearGradient id="oriole-pv-bark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#CDB89D"/>
    <stop offset="0.3" stop-color="#B49A7C"/>
    <stop offset="0.7" stop-color="#94785D"/>
    <stop offset="1" stop-color="#6F5844"/>
  </linearGradient>
  <!-- a painted branch bar, top surface at y=0, from x=-L/2.. (drawn per use with a transform) -->
  <g id="oriole-pv-branch">
    <g filter="url(#wc-paint)">
      <path d="M -430,6 C -300,-2 -150,1 0,0 C 150,-1 300,-3 430,2 C 436,10 436,26 428,34 C 300,36 150,35 0,35 C -150,35 -300,36 -428,38 C -436,28 -436,14 -430,6 Z" fill="url(#oriole-pv-bark)"/>
      <path d="M -400,4 C -250,0 -100,1 60,0.5 C 200,0 320,-1 410,2" fill="none" stroke="#DCCBB2" stroke-width="3" opacity="0.7"/>
      <path d="M -380,20 c 30,2 60,1 90,3 M -200,26 c 40,1 70,0 100,2 M -60,18 c 30,1 60,1 85,2 M 120,24 c 40,1 70,0 110,2 M 260,16 c 30,1 50,2 80,2" fill="none" stroke="#6F5844" stroke-width="1.6" opacity="0.4"/>
      <path d="M -330,12 c 20,0 40,1 55,1 M 10,10 c 25,0 45,0 60,1 M 300,10 c 20,0 40,1 50,1" fill="none" stroke="#F0E4D2" stroke-width="1.4" opacity="0.45"/>
    </g>
  </g>
  <g id="oriole-pv-stub">
    <g filter="url(#wc-paint)">
      <path d="M -150,5 C -80,0 0,0 80,-0.5 C 120,-1 140,0 152,3 C 157,12 157,25 150,33 C 100,34 40,34 -20,34 C -80,35 -120,36 -150,37 C -157,28 -157,14 -150,5 Z" fill="url(#oriole-pv-bark)"/>
      <path d="M -140,3.5 C -60,0 30,0.5 145,2" fill="none" stroke="#DCCBB2" stroke-width="2.6" opacity="0.7"/>
      <path d="M -120,20 c 30,2 60,1 90,3 M 20,24 c 40,1 70,0 100,2" fill="none" stroke="#6F5844" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>
</defs>

<!-- soft sky backdrop (overhangs 60 px) -->
<rect x="-60" y="-60" width="1920" height="1760" fill="url(#oriole-pv-sky)" filter="url(#wc-wash)"/>

<g font-family="sans-serif" font-size="17" fill="#5F7480">
  <text x="40" y="44">(a) two orioles on a branch — scale 1 and 0.94 (head −8°)</text>
  <text x="960" y="44">(b) wing at 0° and lifted (rotate −28° about shoulder −40,−68)</text>
  <text x="40" y="470">(c) head tilted −15° and +15° about neck pivot (−64,−72)</text>
  <text x="960" y="470">(d) exploded parts, red = pivots, + = local origin (scale 1.3)</text>
  <text x="40" y="800">(e) scale 0.6</text>
</g>

<!-- (a) -->
<g transform="translate(470 330)"><use href="#oriole-pv-branch"/></g>
<g transform="translate(300 330)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
</g>
<g transform="translate(640 330) scale(0.94)">
  <use href="#oriole-shadow"/>
  <use href="#oriole-body"/>
  <use href="#oriole-head" transform="rotate(-8 -64 -72)"/>
  <use href="#oriole-wing"/>
</g>

<!-- (b) -->
<g transform="translate(1160 330)"><use href="#oriole-pv-stub"/></g>
<g transform="translate(1160 330)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
</g>
<g transform="translate(1540 330)"><use href="#oriole-pv-stub"/></g>
<g transform="translate(1540 330)">
  <use href="#oriole-shadow"/>
  <use href="#oriole-body"/>
  <use href="#oriole-head"/>
  <use href="#oriole-wing" transform="rotate(-28 -40 -68)"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#6B7F8A">
  <text x="1160" y="400" text-anchor="middle">wing 0°</text>
  <text x="1540" y="400" text-anchor="middle">wing −28° (lifted)</text>
</g>

<!-- (c) -->
<g transform="translate(250 650)"><use href="#oriole-pv-stub"/></g>
<g transform="translate(250 650)">
  <use href="#oriole-shadow"/>
  <use href="#oriole-body"/>
  <use href="#oriole-head" transform="rotate(-15 -64 -72)"/>
  <use href="#oriole-wing"/>
</g>
<g transform="translate(620 650)"><use href="#oriole-pv-stub"/></g>
<g transform="translate(620 650)">
  <use href="#oriole-shadow"/>
  <use href="#oriole-body"/>
  <use href="#oriole-head" transform="rotate(15 -64 -72)"/>
  <use href="#oriole-wing"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#6B7F8A">
  <text x="250" y="720" text-anchor="middle">head −15° (looks further down)</text>
  <text x="620" y="720" text-anchor="middle">head +15° (beak up)</text>
</g>

<!-- (d) exploded: body at origin, head shifted (-70,-30), wing shifted (60,-55) -->
<g transform="translate(1330 760) scale(1.3)">
  <use href="#oriole-body"/>
  <g transform="translate(-70 -30)">
    <use href="#oriole-head"/>
    <circle cx="-64" cy="-72" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.4"/>
    <circle cx="-64" cy="-72" r="0.9" fill="#D0342C"/>
  </g>
  <g transform="translate(60 -55)">
    <use href="#oriole-wing"/>
    <circle cx="-40" cy="-68" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.4"/>
    <circle cx="-40" cy="-68" r="0.9" fill="#D0342C"/>
  </g>
  <path d="M -6,0 H 6 M 0,-6 V 6" stroke="#D0342C" stroke-width="1"/>
  <g font-family="sans-serif" font-size="11" fill="#7A3A34">
    <text x="-196" y="-142">oriole-head  pivot (−64,−72)</text>
    <text x="-30" y="-150">oriole-wing  pivot (−40,−68)</text>
    <text x="10" y="22">oriole-body  origin (0,0) = feet on branch top</text>
  </g>
</g>

<!-- (f) detail at 1.8x -->
<g transform="translate(690 968) scale(1.7)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
</g>
<text x="940" y="985" font-family="sans-serif" font-size="17" fill="#5F7480">(f) detail, scale 1.7</text>

<!-- (e) small 0.6 version -->
<g transform="translate(250 920) scale(0.6)"><use href="#oriole-pv-stub"/></g>
<g transform="translate(250 920) scale(0.6)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
</g>

<!-- ===================== FLIGHT POSE ===================== -->
<line x1="40" y1="1012" x2="1760" y2="1012" stroke="#9FB6C4" stroke-width="1" opacity="0.6"/>
<g font-family="sans-serif" font-size="17" fill="#5F7480">
  <text x="40" y="1040">(g) flight, assembled (mid-beat), scale 1</text>
  <text x="440" y="1040">(h) flap in sync: wings −22° / +22° (near about (−36,−76), far about (−20,−74))</text>
  <text x="1200" y="1040">(j) hand-over: perched + flying at 50 %, same origin</text>
  <text x="40" y="1352">(i) exploded flight parts, red = pivots, + = local origin (scale 1.1)</text>
</g>
<!-- (g) -->
<g transform="translate(230 1262)"><use href="#oriole-fly"/></g>
<!-- (h) -->
<g transform="translate(600 1262)">
  <use href="#oriole-fly-wing-far" transform="rotate(-22 -20 -74)"/>
  <use href="#oriole-fly-body"/>
  <use href="#oriole-fly-wing-near" transform="rotate(-22 -36 -76)"/>
</g>
<g transform="translate(960 1262)">
  <use href="#oriole-fly-wing-far" transform="rotate(22 -20 -74)"/>
  <use href="#oriole-fly-body"/>
  <use href="#oriole-fly-wing-near" transform="rotate(22 -36 -76)"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#6B7F8A">
  <text x="600" y="1300" text-anchor="middle">−22° (up-stroke)</text>
  <text x="960" y="1300" text-anchor="middle">+22° (down-stroke)</text>
  <text x="1330" y="1324" text-anchor="middle">mid-beat</text>
  <text x="1620" y="1324" text-anchor="middle">wings +22°</text>
</g>
<!-- (j) hand-over -->
<g transform="translate(1330 1262)"><use href="#oriole-pv-stub" transform="scale(0.72 1)"/></g>
<g transform="translate(1330 1262)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
  <use href="#oriole-fly" opacity="0.5"/>
</g>
<g transform="translate(1620 1262)"><use href="#oriole-pv-stub" transform="scale(0.72 1)"/></g>
<g transform="translate(1620 1262)">
  <use href="#oriole-shadow"/>
  <use href="#oriole"/>
  <g opacity="0.5">
    <use href="#oriole-fly-wing-far" transform="rotate(22 -20 -74)"/>
    <use href="#oriole-fly-body"/>
    <use href="#oriole-fly-wing-near" transform="rotate(22 -36 -76)"/>
  </g>
</g>
<!-- (i) exploded -->
<g transform="translate(240 1575) scale(1.1)">
  <use href="#oriole-fly-body"/>
  <path d="M -6,0 H 6 M 0,-6 V 6" stroke="#D0342C" stroke-width="1"/>
  <g transform="translate(300 0)">
    <use href="#oriole-fly-wing-near"/>
    <circle cx="-36" cy="-76" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.4"/>
    <circle cx="-36" cy="-76" r="0.9" fill="#D0342C"/>
  </g>
  <g transform="translate(560 0)">
    <use href="#oriole-fly-wing-far"/>
    <circle cx="-20" cy="-74" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.4"/>
    <circle cx="-20" cy="-74" r="0.9" fill="#D0342C"/>
  </g>
  <g transform="translate(860 0)">
    <use href="#oriole-fly"/>
    <circle cx="-36" cy="-76" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.4"/>
    <circle cx="-20" cy="-74" r="3.2" fill="none" stroke="#D0342C" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <path d="M -6,0 H 6 M 0,-6 V 6" stroke="#D0342C" stroke-width="1"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#7A3A34">
    <text x="-120" y="16">oriole-fly-body (origin + = (0,0))</text>
    <text x="200" y="16">oriole-fly-wing-near  pivot (−36,−76)</text>
    <text x="470" y="16">oriole-fly-wing-far  pivot (−20,−74)</text>
    <text x="770" y="16">oriole-fly (far wing, body, near wing)</text>
  </g>
</g>
</svg>
