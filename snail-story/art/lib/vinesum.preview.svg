<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<defs><linearGradient id="vinesum-pv-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D6E8"/><stop offset="0.6" stop-color="#CFE4EF"/><stop offset="1" stop-color="#EAF3F2"/></linearGradient></defs>
