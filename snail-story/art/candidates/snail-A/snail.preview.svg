<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
<defs>
  <linearGradient id="snail-pv-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D6E8"/><stop offset="0.5" stop-color="#CFE4EF"/><stop offset="1" stop-color="#EAF3F2"/></linearGradient>
  <linearGradient id="snail-pv-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C98B"/><stop offset="1" stop-color="#C5DBA6"/></linearGradient>
  <linearGradient id="snail-pv-bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDB89D"/><stop offset="0.3" stop-color="#B49A7C"/><stop offset="1" stop-color="#7E654E"/></linearGradient>
</defs>
<rect x="-60" y="-60" width="1920" height="1280" fill="url(#snail-pv-sky)" filter="url(#wc-wash)"/>

<!-- row 1 : ground y = 350 -->
<rect x="50" y="340" width="400" height="44" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(240 350)"><use href="#snail-shadow"/><use href="#snail"/></g>
<text x="50" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(a) snail, scale 1, with snail-shadow</text>
<rect x="470" y="340" width="380" height="44" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(650 350)"><use href="#snail-shadow"/><use href="#snail-headup"/></g>
<text x="470" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(d) snail-headup (head -22°)</text>
<rect x="870" y="340" width="740" height="44" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(1050 350)"><use href="#snail-shadow"/><use href="#snail-head" transform="rotate(-25 80 -38)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<g transform="translate(1430 350)"><use href="#snail-shadow"/><use href="#snail-head" transform="rotate(10 80 -38)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<text x="870" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(e) head -25° / +10° around the neck pivot, layered below body + shell</text>
<rect x="1630" y="340" width="150" height="44" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(1705 350) scale(0.6)"><use href="#snail-shadow"/><use href="#snail"/></g>
<text x="1640" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(h) scale 0.6</text>

<!-- row 2 : ground y = 760 -->
<rect x="50" y="750" width="740" height="44" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(240 760)"><use href="#snail-shadow"/><use href="#snail-stalk-far" transform="rotate(-8 112 -73.5)"/><use href="#snail-head-base"/><use href="#snail-stalk-near" transform="rotate(-8 123.6 -76)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<g transform="translate(610 760)"><use href="#snail-shadow"/><use href="#snail-stalk-far" transform="rotate(8 112 -73.5)"/><use href="#snail-head-base"/><use href="#snail-stalk-near" transform="rotate(8 123.6 -76)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<text x="50" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(f) eyestalks swayed -8° / +8° around their bases</text>
<g transform="translate(1010 655) rotate(-63)">
  <rect x="-185" y="-1" width="380" height="58" rx="26" fill="url(#snail-pv-bark)" filter="url(#wc-paint)"/>
  <use href="#snail-shadow"/><use href="#snail"/>
</g>
<text x="850" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(b) rotated -63° (climbing)</text>
<g transform="translate(1470 615) rotate(-90)">
  <rect x="-175" y="-1" width="350" height="76" rx="30" fill="url(#snail-pv-bark)" filter="url(#wc-paint)"/>
  <use href="#snail-shadow"/><use href="#snail"/>
</g>
<text x="1290" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(c) rotated -90° on a vertical trunk</text>

<!-- row 3 : exploded view, baseline y = 1100 -->
<text x="50" y="868" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(g) exploded parts, red = pivot:  body · shell · head-base · stalk-far · stalk-near · head · shadow · assembled</text>
<g transform="translate(200 1100)"><use href="#snail-body"/><circle cx="0" cy="0" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="0" cy="0" r="0.9" fill="#E0301E"/></g>
<g transform="translate(470 1110)"><use href="#snail-shell"/></g>
<g transform="translate(540 1100)"><use href="#snail-head-base"/><circle cx="80" cy="-38" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/></g>
<g transform="translate(625 1110)"><use href="#snail-stalk-far"/><circle cx="112" cy="-73.5" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-73.5" r="0.9" fill="#E0301E"/></g>
<g transform="translate(665 1110)"><use href="#snail-stalk-near"/><circle cx="123.6" cy="-76" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="123.6" cy="-76" r="0.9" fill="#E0301E"/></g>
<g transform="translate(830 1100)"><use href="#snail-head"/><circle cx="80" cy="-38" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/><circle cx="123.6" cy="-76" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="123.6" cy="-76" r="0.9" fill="#E0301E"/><circle cx="112" cy="-73.5" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-73.5" r="0.9" fill="#E0301E"/></g>
<g transform="translate(1180 1100)"><use href="#snail-shadow"/><circle cx="0" cy="0" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="0" cy="0" r="0.9" fill="#E0301E"/></g>
<g transform="translate(1590 1100)"><use href="#snail"/><circle cx="0" cy="0" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="0" cy="0" r="0.9" fill="#E0301E"/><circle cx="80" cy="-38" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/><circle cx="123.6" cy="-76" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="123.6" cy="-76" r="0.9" fill="#E0301E"/><circle cx="112" cy="-73.5" r="3.4" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-73.5" r="0.9" fill="#E0301E"/></g>
</svg>
