<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140">
<defs>
  <linearGradient id="snail-pv-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D6E8"/><stop offset="0.5" stop-color="#CFE4EF"/><stop offset="1" stop-color="#EAF3F2"/></linearGradient>
  <linearGradient id="snail-pv-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C98B"/><stop offset="1" stop-color="#C5DBA6"/></linearGradient>
  <linearGradient id="snail-pv-bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDB89D"/><stop offset="0.35" stop-color="#B49A7C"/><stop offset="1" stop-color="#7E654E"/></linearGradient>
</defs>
<rect x="-60" y="-60" width="1920" height="1260" fill="url(#snail-pv-sky)" filter="url(#wc-wash)"/>

<!-- (a) scale 1 on grass with shadow -->
<rect x="40" y="318" width="420" height="40" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(240 330)"><use href="#snail-shadow"/><use href="#snail"/></g>
<text x="40" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(a) snail, scale 1, with snail-shadow</text>

<!-- (d) headup -->
<rect x="480" y="318" width="380" height="40" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(660 330)"><use href="#snail-shadow"/><use href="#snail-headup"/></g>
<text x="480" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(d) snail-headup (head -22°)</text>

<!-- (e) head -25 / +10 -->
<rect x="880" y="318" width="740" height="40" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(1060 330)"><use href="#snail-shadow"/><use href="#snail-head" transform="rotate(-25 80 -38)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<g transform="translate(1440 330)"><use href="#snail-shadow"/><use href="#snail-head" transform="rotate(10 80 -38)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<text x="880" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(e) head rotated -25° and +10° around neck pivot (80,-38), below body+shell</text>

<!-- (h) scale 0.6 -->
<rect x="1640" y="318" width="150" height="40" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(1715 330) scale(0.6)"><use href="#snail-shadow"/><use href="#snail"/></g>
<text x="1645" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(h) scale 0.6</text>

<!-- (f) stalks swayed -8 / +8 -->
<rect x="40" y="668" width="760" height="40" rx="18" fill="url(#snail-pv-grass)" filter="url(#wc-wash)"/>
<g transform="translate(240 680)"><use href="#snail-shadow"/><use href="#snail-stalk-far" transform="rotate(-8 112 -77)"/><use href="#snail-head-base"/><use href="#snail-stalk-near" transform="rotate(-8 125 -78)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<g transform="translate(600 680)"><use href="#snail-shadow"/><use href="#snail-stalk-far" transform="rotate(8 112 -77)"/><use href="#snail-head-base"/><use href="#snail-stalk-near" transform="rotate(8 125 -78)"/><use href="#snail-body"/><use href="#snail-shell"/></g>
<text x="40" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(f) eyestalks swayed -8° / +8° around their bases</text>

<!-- (b) climbing, rotated -63 on a diagonal trunk bar -->
<g transform="translate(1000 640) rotate(-63)">
  <rect x="-300" y="-2" width="560" height="64" rx="28" fill="url(#snail-pv-bark)" filter="url(#wc-paint)"/>
  <use href="#snail-shadow"/><use href="#snail"/>
</g>
<text x="830" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(b) rotated -63° on a trunk</text>

<!-- (c) rotated -90 on a vertical trunk -->
<g transform="translate(1450 560) rotate(-90)">
  <rect x="-230" y="-2" width="520" height="80" rx="30" fill="url(#snail-pv-bark)" filter="url(#wc-paint)"/>
  <use href="#snail-shadow"/><use href="#snail"/>
</g>
<text x="1330" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(c) rotated -90° on a vertical trunk</text>

<!-- (g) exploded view, pivots in red -->
<text x="40" y="790" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#6F5844" opacity="0.85">(g) exploded parts (red = pivots):  body · shell · head-base · stalk-far · stalk-near · head · shadow</text>
<g transform="translate(200 1020)"><use href="#snail-body"/></g>
<g transform="translate(420 1010)"><use href="#snail-shell"/></g>
<g transform="translate(470 1040)"><use href="#snail-head-base"/><circle cx="80" cy="-38" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/></g>
<g transform="translate(600 1080)"><use href="#snail-stalk-far"/><circle cx="112" cy="-77" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-77" r="0.9" fill="#E0301E"/></g>
<g transform="translate(640 1080)"><use href="#snail-stalk-near"/><circle cx="125" cy="-78" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="125" cy="-78" r="0.9" fill="#E0301E"/></g>
<g transform="translate(860 1040)"><use href="#snail-head"/><circle cx="80" cy="-38" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/><circle cx="125" cy="-78" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="125" cy="-78" r="0.9" fill="#E0301E"/><circle cx="112" cy="-77" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-77" r="0.9" fill="#E0301E"/></g>
<g transform="translate(1200 1060)"><use href="#snail-shadow"/><circle cx="0" cy="0" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="0" cy="0" r="0.9" fill="#E0301E"/></g>
<g transform="translate(1560 1060)"><use href="#snail"/><circle cx="0" cy="0" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="0" cy="0" r="0.9" fill="#E0301E"/><circle cx="80" cy="-38" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="80" cy="-38" r="0.9" fill="#E0301E"/><circle cx="125" cy="-78" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="125" cy="-78" r="0.9" fill="#E0301E"/><circle cx="112" cy="-77" r="3.2" fill="none" stroke="#E0301E" stroke-width="1.6"/><circle cx="112" cy="-77" r="0.9" fill="#E0301E"/></g>
</svg>
